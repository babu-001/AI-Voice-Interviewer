<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Voice Interviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#E6DCCF; --cream:#F5EDE3; --shell:#FCF8F2; --blush:#EBCCC3; --rose:#D9958F;
  --peach:#EDB98F; --butter:#F0D9A2; --mauve:#9B7F96; --sage:#B9D4C0;
  --ink:#3E343A; --ink2:#6E6068; --line:rgba(62,52,58,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Outfit',system-ui,sans-serif; color:var(--ink); background:var(--sand);
  position:relative; overflow-x:hidden; min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:32px 16px;
}
/* backdrop shapes, taken from the reference image */
body::before{content:"";position:fixed;right:0;top:0;width:46vw;height:100vh;background:var(--blush);
  clip-path:polygon(38% 0,100% 0,100% 100%,0 100%);opacity:.75;z-index:0}
body::after{content:"";position:fixed;left:-90px;bottom:-110px;width:300px;height:230px;border-radius:50%;
  background:var(--cream);box-shadow:0 20px 50px -20px rgba(110,70,70,.3);z-index:0}
.orb{position:fixed;left:8%;bottom:6%;width:92px;height:92px;border-radius:50%;z-index:0;
  background:radial-gradient(circle at 35% 30%,#F8E7C4,var(--butter));box-shadow:0 18px 30px -14px rgba(110,70,70,.4)}
.pendant{position:fixed;left:5%;top:0;z-index:0;display:flex;flex-direction:column;align-items:center}
.pendant i{display:block;width:2px;height:90px;background:var(--ink2);opacity:.5}
.pendant b{display:block;width:58px;height:70px;border-radius:50% 50% 50% 50% / 30% 30% 70% 70%;background:var(--cream);
  box-shadow:inset -8px -8px 14px rgba(155,127,150,.18),0 14px 24px -12px rgba(110,70,70,.35)}

#root{position:relative;z-index:1;width:100%;max-width:980px}
/* device frame */
.device{
  position:relative; z-index:1; width:100%; max-width:980px; background:var(--shell);
  border-radius:40px; padding:10px;
  box-shadow:0 50px 90px -40px rgba(110,70,70,.45),0 0 0 1px rgba(255,255,255,.7) inset;
}
.screen-area{background:var(--cream);border-radius:32px;border:1px solid var(--line);overflow:hidden;position:relative}
.top{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;flex:none}
.logo::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--peach)}
.top h1{margin:0;font-size:20px;font-weight:400;letter-spacing:.2px}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 14px;border-radius:99px;background:rgba(155,127,150,.12);color:var(--ink2);transition:background .3s}
.chip.on{background:var(--peach);color:var(--ink);font-weight:500}
.chip.done{background:var(--sage);color:var(--ink)}

/* stage with robot */
.stage{position:relative;padding:34px 20px 26px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.chart{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%;z-index:0;pointer-events:none}
.stage>*:not(.chart){position:relative;z-index:1}

.rig{--w:230px;position:relative;width:var(--w);height:calc(var(--w)*1.2);margin-top:6px;transition:--w .3s}
.rig.sm{--w:130px}
.pod{position:absolute;left:50%;bottom:-6px;width:150%;height:calc(var(--w)*.16);transform:translateX(-50%);
  border-radius:50%;background:var(--shell);box-shadow:0 14px 26px -10px rgba(110,70,70,.4),inset 0 -6px 0 rgba(235,204,195,.7)}
.bot{position:absolute;inset:0 0 calc(var(--w)*.06) 0;animation:float 5s ease-in-out infinite}
.antenna{position:absolute;left:50%;top:0;width:3px;height:calc(var(--w)*.1);background:var(--mauve);transform:translateX(-50%);border-radius:2px}
.bulb{position:absolute;left:50%;top:calc(var(--w)*-.025);width:calc(var(--w)*.065);height:calc(var(--w)*.065);border-radius:50%;
  background:var(--peach);transform:translateX(-50%);transition:box-shadow .3s,background .3s}
.head{position:absolute;left:6%;right:6%;top:calc(var(--w)*.085);height:calc(var(--w)*.62);background:var(--shell);
  border-radius:calc(var(--w)*.2);box-shadow:inset 0 calc(var(--w)*-.04) 0 rgba(155,127,150,.14),0 18px 30px -14px rgba(110,70,70,.4)}
.ear{position:absolute;top:34%;width:calc(var(--w)*.05);height:26%;background:var(--blush);border-radius:99px}
.ear.l{left:calc(var(--w)*-.03)} .ear.r{right:calc(var(--w)*-.03)}
.face{position:absolute;inset:13% 8%;background:var(--ink);border-radius:calc(var(--w)*.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--w)*.06);
  box-shadow:inset 0 0 24px rgba(0,0,0,.35)}
.eyes{display:flex;gap:calc(var(--w)*.15)}
.eye{width:calc(var(--w)*.075);height:calc(var(--w)*.105);border-radius:99px;background:var(--sage);
  box-shadow:0 0 14px var(--sage);animation:blink 5.5s infinite;transform-origin:center;transition:background .3s,box-shadow .3s}
.smile{width:calc(var(--w)*.13);height:calc(var(--w)*.05);border-bottom:3px solid var(--peach);border-radius:0 0 99px 99px}
.bars{display:none;align-items:center;gap:3px;height:calc(var(--w)*.08)}
.bars i{width:4px;height:5px;border-radius:3px;background:var(--peach)}
.neck{position:absolute;left:44%;right:44%;top:calc(var(--w)*.7);height:calc(var(--w)*.05);background:var(--mauve);opacity:.45}
.torso{position:absolute;left:24%;right:24%;top:calc(var(--w)*.74);height:calc(var(--w)*.36);background:var(--shell);
  border-radius:calc(var(--w)*.14) calc(var(--w)*.14) calc(var(--w)*.18) calc(var(--w)*.18);
  box-shadow:inset 0 calc(var(--w)*-.04) 0 rgba(155,127,150,.14),0 14px 24px -14px rgba(110,70,70,.4);display:grid;place-items:center}
.core{width:calc(var(--w)*.09);height:calc(var(--w)*.09);border-radius:50%;background:var(--sage);box-shadow:0 0 12px var(--sage);transition:background .3s}
.arm{position:absolute;top:calc(var(--w)*.78);width:calc(var(--w)*.075);height:calc(var(--w)*.27);background:var(--blush);border-radius:99px;transform-origin:top center}
.arm.l{left:14%;transform:rotate(10deg)} .arm.r{right:14%;transform:rotate(-10deg)}
.ring{position:absolute;left:2%;right:2%;top:calc(var(--w)*.05);height:calc(var(--w)*.7);border-radius:calc(var(--w)*.24);
  border:2px solid var(--peach);opacity:0;pointer-events:none}

/* robot states */
.rig.talk .smile{display:none}
.rig.talk .bars{display:flex}
.rig.talk .bars i{animation:bar .5s ease-in-out infinite alternate}
.rig.talk .bars i:nth-child(2){animation-delay:.1s}.rig.talk .bars i:nth-child(3){animation-delay:.2s}
.rig.talk .bars i:nth-child(4){animation-delay:.05s}.rig.talk .bars i:nth-child(5){animation-delay:.25s}
.rig.talk .arm.l{animation:gesL 1.6s ease-in-out infinite}
.rig.talk .arm.r{animation:gesR 1.9s ease-in-out infinite}
.rig.talk .core{background:var(--peach);box-shadow:0 0 12px var(--peach)}
.rig.listen .eye{background:var(--peach);box-shadow:0 0 16px var(--peach)}
.rig.listen .bulb{background:var(--rose);box-shadow:0 0 0 6px rgba(217,149,143,.3),0 0 18px var(--rose)}
.rig.listen .ring{animation:ring 1.6s ease-out infinite}
.rig.listen .core{background:var(--rose);box-shadow:0 0 12px var(--rose)}
.rig.think .eyes{animation:scan 1.6s ease-in-out infinite}
.rig.think .core{background:var(--butter);box-shadow:0 0 12px var(--butter)}

@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes bar{from{height:4px}to{height:calc(var(--w)*.075)}}
@keyframes gesL{50%{transform:rotate(26deg)}}
@keyframes gesR{50%{transform:rotate(-30deg)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
@keyframes scan{0%,100%{transform:translateX(calc(var(--w)*-.04))}50%{transform:translateX(calc(var(--w)*.04))}}

/* robot speech */
.say{margin:34px auto 0;max-width:640px;text-align:center;font-size:21px;line-height:1.45;font-weight:300;min-height:62px}
.say.small{font-size:19px;margin-top:28px}
.sub{color:var(--ink2);font-size:16px;text-align:center;max-width:520px;margin:10px auto 0}

/* controls */
.btn{font:inherit;font-size:16px;font-weight:500;border:0;border-radius:99px;padding:12px 26px;cursor:pointer;
  background:var(--peach);color:var(--ink);transition:transform .15s,background .2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#F2C29C}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:rgba(155,127,150,.14)}
.btn.ghost:hover:not(:disabled){background:rgba(155,127,150,.24)}
:focus-visible{outline:3px solid var(--mauve);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.drop{display:inline-flex;flex-direction:column;align-items:center;gap:6px;margin-top:22px;padding:22px 40px;border-radius:26px;
  border:2px dashed var(--mauve);background:rgba(252,248,242,.8);cursor:pointer;font-size:17px;text-align:center}
.drop small{color:var(--ink2);font-size:14px}
.drop.dis{opacity:.55;cursor:wait}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:3px solid var(--mauve);outline-offset:3px}
.err{margin:16px auto 0;max-width:640px;background:#F3D2CC;border:1px solid var(--rose);color:#6B2C2A;padding:10px 16px;border-radius:16px;font-size:15px;text-align:center}

/* interview panel */
.panel{width:100%;max-width:700px;margin-top:20px;background:rgba(252,248,242,.92);border:1px solid var(--line);border-radius:28px;padding:22px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:15px;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.track{height:8px;border-radius:99px;background:rgba(155,127,150,.18);overflow:hidden;width:100%;max-width:700px;margin-top:22px}
.track div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--peach),var(--rose));transition:width .5s}
.mic{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.micbtn{width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;background:var(--peach);color:var(--ink);display:grid;place-items:center;flex:none;transition:background .2s,transform .15s}
.micbtn:hover{transform:scale(1.05)}
.micbtn.rec{background:#B4506A;color:#fff}
.mic span{color:var(--ink2);font-size:16px}
textarea{width:100%;height:120px;resize:vertical;border-radius:20px;border:1px solid var(--line);background:#fff;padding:14px 16px;
  font:inherit;font-size:16px;color:var(--ink);line-height:1.5}
textarea:focus{outline:3px solid var(--mauve);outline-offset:1px}
.hint{color:var(--ink2);font-size:14px;margin:0 0 8px}

/* feedback + results */
.score{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.score b{font-size:40px;font-weight:500}.score span{color:var(--ink2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.box{border-radius:20px;padding:14px 18px}
.box h3{margin:0 0 6px;font-size:16px;font-weight:600}
.box ul{margin:0;padding-left:18px;line-height:1.5;font-size:15px}
.box.good{background:rgba(185,212,192,.45)}.box.miss{background:rgba(235,204,195,.6)}
.box.better{background:rgba(155,127,150,.14);margin-top:14px}
.box.better p{margin:0;font-size:15px;line-height:1.55}
.hero{margin-bottom:18px;display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.dial{--p:0;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--peach) calc(var(--p)*1%),rgba(155,127,150,.18) 0)}
.dial div{width:130px;height:130px;border-radius:50%;background:var(--shell);display:grid;place-items:center;text-align:center}
.dial b{font-size:40px;font-weight:500;line-height:1}.dial small{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.secs{min-width:240px;flex:1;max-width:340px}
.sec{margin:10px 0}.sec p{display:flex;justify-content:space-between;margin:0 0 4px;font-size:15px}
.sec .track{margin:0;max-width:none}
.sec:nth-child(2) .track div{background:linear-gradient(90deg,var(--sage),#8FB89B)}
.sec:nth-child(3) .track div{background:linear-gradient(90deg,var(--mauve),#B79BB2)}

@media (max-width:700px){
  .cols{grid-template-columns:1fr}
  .top{padding:14px 16px;flex-wrap:wrap}.chips{margin-left:0}
  .rig{--w:190px}.pendant,.orb{display:none}
  .say{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pendant" aria-hidden="true"><i></i><b></b></div>
<div class="orb" aria-hidden="true"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useRef}=React, html=htm.bind(React.createElement);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
async function api(u,o){const r=await fetch(u,o);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch{}throw new Error(m)}return r}
const LBL={intro:"Introduction",skills:"Technical skills",projects:"Projects"};
const ORDER=["intro","skills","projects"];

const Icon=({n})=>{
  const p={width:24,height:24,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round","aria-hidden":"true"};
  if(n==="mic")return html`<svg ...${p}><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
  if(n==="stop")return html`<svg ...${p}><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
  if(n==="speaker")return html`<svg ...${p} width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4zM17 8a5 5 0 0 1 0 8"/></svg>`;
  if(n==="file")return html`<svg ...${p} width="18" height="18"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5zM14 3v5h5"/></svg>`;
  return null};

const Chart=()=>html`<svg class="chart" viewBox="0 0 800 220" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 220V160C90 150 170 110 250 126 330 142 390 178 490 160 590 142 690 158 800 138V220Z" fill="#9B7F96" opacity=".22"/>
  <path d="M0 220V182C110 130 220 36 330 66 430 92 480 162 600 154 700 147 760 128 800 132V220Z" fill="#EBCCC3" opacity=".75"/>
  <path d="M0 220V196C120 190 210 120 290 104 360 90 410 70 470 120 540 178 640 172 800 190V220Z" fill="#EDB98F" opacity=".5"/>
  <path d="M0 220V206C160 200 300 188 420 196 560 205 680 190 800 200V220Z" fill="#B9D4C0" opacity=".7"/>
</svg>`;

function Robot({state,small}){
  return html`<div class=${"rig "+state+(small?" sm":"")} role="img" aria-label=${"Robot interviewer, "+state}>
    <div class="pod"></div>
    <div class="bot">
      <div class="antenna"></div><div class="bulb"></div>
      <div class="arm l"></div><div class="arm r"></div>
      <div class="neck"></div>
      <div class="torso"><div class="core"></div></div>
      <div class="ring"></div>
      <div class="head">
        <div class="ear l"></div><div class="ear r"></div>
        <div class="face">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="smile"></div>
          <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>
  </div>`}

function App(){
  const [stage,setStage]=useState("welcome"),[msg,setMsg]=useState(""),[talk,setTalk]=useState(false);
  const [sess,setSess]=useState(null),[i,setI]=useState(0),[text,setText]=useState(""),[fb,setFb]=useState(null);
  const [rec,setRec]=useState(false),[busy,setBusy]=useState(false),[err,setErr]=useState(""),[res,setRes]=useState(null);
  const recog=useRef(null),base=useRef("");

  function say(t,done){setMsg(t);setTalk(true);
    if(!window.speechSynthesis){setTalk(false);return done&&done()}
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
    u.onend=u.onerror=()=>{setTalk(false);done&&done()};speechSynthesis.speak(u)}

  function start(){setStage("upload");
    say("Hello! Welcome to your AI mock interview. Please upload your resume to begin your personalized interview.",
        ()=>say("Please upload your resume here."))}

  async function upload(e){const f=e.target.files[0];setErr("");if(!f)return;
    if(!f.name.toLowerCase().endsWith(".pdf"))return setErr("Please choose a PDF file.");
    if(f.size>5*1024*1024)return setErr("File is larger than 5 MB.");
    setBusy(true);setMsg("Reading your resume and preparing questions...");
    try{const fd=new FormData();fd.append("file",f);
      const s=await (await api("/api/resume",{method:"POST",body:fd})).json();
      setSess(s);setStage("interview");ask(s.questions,0,true)}
    catch(x){setErr(x.message);setMsg("Please upload your resume here.")}
    setBusy(false)}

  function ask(qs,n,first){setI(n);setText("");setFb(null);setErr("");
    const q=qs[n],intro=first?"Thank you. Let's begin with the introduction. ":(n&&qs[n-1].section!==q.section?"Now moving to the next section. ":"Next question. ");
    say(intro+q.question)}

  function toggleMic(){
    if(rec){recog.current&&recog.current.stop();return}
    if(!SR)return setErr("Speech recognition isn't supported in this browser. Use Chrome/Edge, or type your answer.");
    speechSynthesis.cancel();setTalk(false);base.current=text;const r=new SR();recog.current=r;r.lang="en-US";r.continuous=true;r.interimResults=true;
    r.onresult=ev=>{let s="";for(const x of ev.results)s+=x[0].transcript+" ";setText((base.current+" "+s).trim())};
    r.onerror=ev=>{setErr(ev.error==="not-allowed"?"Microphone permission denied. Allow it in your browser, or type your answer.":"Speech error: "+ev.error);setRec(false)};
    r.onend=()=>setRec(false);r.start();setRec(true)}

  async function submit(){if(busy)return;setBusy(true);setErr("");recog.current&&rec&&recog.current.stop();
    try{setFb(await (await api("/api/answer",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session_id:sess.session_id,question_id:i,transcript:text})})).json())}
    catch(x){setErr(x.message)}setBusy(false)}

  async function next(){const qs=sess.questions;
    if(i+1<qs.length)return ask(qs,i+1);
    setBusy(true);setMsg("Evaluating your interview...");
    try{const r=await (await api("/api/result/"+sess.session_id)).json();setRes(r);setStage("result");
      say("Your interview is complete. Your total score is "+r.total+" out of 100.")}
    catch(x){setErr(x.message)}setBusy(false)}

  async function download(){try{const b=await (await api("/api/report/"+sess.session_id)).blob();
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="interview_report.pdf";a.click()}
    catch(x){setErr("PDF download failed: "+x.message)}}

  async function restart(){speechSynthesis.cancel();
    if(sess)await fetch("/api/session/"+sess.session_id,{method:"DELETE"}).catch(()=>{});
    setSess(null);setRes(null);setStage("welcome");setMsg("");setErr("");setTalk(false)}

  const q=sess&&sess.questions[i];
  const state=rec?"listen":talk?"talk":busy?"think":"idle";
  const cur=q?ORDER.indexOf(q.section):-1;
  const pct=sess?((i+(fb?1:0))/sess.questions.length*100):0;

  return html`<main class="device"><div class="screen-area">
    <header class="top">
      <div class="logo" aria-hidden="true"></div>
      <h1>AI Voice Interviewer</h1>
      ${stage==="interview"&&html`<div class="chips">${ORDER.map((k,n)=>
        html`<span class=${"chip "+(n<cur?"done":n===cur?"on":"")}>${LBL[k]}</span>`)}</div>`}
    </header>

    <section class="stage">
      <${Chart}/>
      <${Robot} state=${state} small=${stage==="result"}/>

      ${stage==="welcome"&&html`
        <p class="say">Hi, I'm your interviewer.</p>
        <p class="sub">Upload your resume and I'll ask questions based on it. Answer by voice or by typing.</p>
        <div class="row"><button class="btn" onClick=${start}>Start interview</button></div>
        <p class="sub" style=${{fontSize:"14px"}}>Starting turns on my voice, so turn up your volume.</p>`}

      ${stage!=="welcome"&&msg&&html`<p class=${"say"+(stage==="result"?" small":"")} aria-live="polite">${msg}</p>`}
      ${err&&html`<div class="err" role="alert">${err}</div>`}

      ${stage==="upload"&&html`<label class=${"drop"+(busy?" dis":"")}>
        <input type="file" accept="application/pdf" onChange=${upload} disabled=${busy}/>
        <span style=${{display:"inline-flex",gap:"8px",alignItems:"center"}}><${Icon} n="file"/>${busy?"Reading your resume...":"Choose your resume"}</span>
        <small>PDF only, up to 5 MB</small></label>`}

      ${stage==="interview"&&q&&html`
        <div class="track" role="progressbar" aria-valuenow=${Math.round(pct)} aria-valuemin="0" aria-valuemax="100"><div style=${{width:pct+"%"}}></div></div>
        <div class="panel">
          <div class="meta"><span>Question ${i+1} of ${sess.questions.length}</span><span>${q.max} marks</span></div>
          ${!fb&&html`
            <div class="mic">
              <button class=${"micbtn"+(rec?" rec":"")} onClick=${toggleMic} aria-label=${rec?"Stop recording":"Record answer"}><${Icon} n=${rec?"stop":"mic"}/></button>
              <span>${rec?"Listening. Tap to stop.":"Tap the mic and speak your answer."}</span>
            </div>
            <p class="hint">Your transcript. Edit it if I misheard.</p>
            <textarea value=${text} onChange=${e=>setText(e.target.value)} placeholder="Your answer appears here..."></textarea>
            <div class="row" style=${{justifyContent:"flex-start"}}>
              <button class="btn" disabled=${busy||!text.trim()} onClick=${submit}>${busy?"Evaluating...":"Submit answer"}</button>
              <button class="btn ghost" onClick=${()=>{setText("");base.current=""}}>Clear</button>
              <button class="btn ghost" onClick=${()=>say(q.question)}><${Icon} n="speaker"/>Repeat question</button>
            </div>`}
          ${fb&&html`
            <div class="score"><b>${fb.marks}</b><span>out of ${fb.max}</span></div>
            <p style=${{margin:"0 0 4px",lineHeight:1.55}}>${fb.reason}</p>
            <div class="cols">
              <div class="box good"><h3>What you got right</h3><ul>${fb.correct.map(x=>html`<li>${x}</li>`)}</ul></div>
              <div class="box miss"><h3>What was missing</h3><ul>${fb.missing.map(x=>html`<li>${x}</li>`)}</ul></div>
            </div>
            <div class="box better"><h3>A stronger answer</h3><p>${fb.improved}</p></div>
            <div class="row" style=${{justifyContent:"flex-start"}}>
              <button class="btn" disabled=${busy} onClick=${next}>${i+1<sess.questions.length?"Next question":"Finish and see results"}</button>
            </div>`}
        </div>`}

      ${stage==="result"&&res&&html`
        <div class="panel">
          <div class="hero">
            <div class="dial" style=${{"--p":res.total}}><div><span><b>${res.total}</b><small>out of 100</small></span></div></div>
            <div class="secs">${Object.keys(res.sections).map(k=>html`<div class="sec">
              <p><span>${LBL[k]}</span><b>${res.sections[k]} / ${res.limits[k]}</b></p>
              <div class="track"><div style=${{width:(res.sections[k]/res.limits[k]*100)+"%"}}></div></div></div>`)}</div>
          </div>
          <div class="cols">
            ${[["Strengths","strengths","good"],["Weaknesses","weaknesses","miss"],["Suggestions","suggestions","better"],["Preparation plan","preparation_plan","good"]].map(([h,k,c])=>
              html`<div class=${"box "+c} style=${{marginTop:0}}><h3>${h}</h3><ul>${(res[k]||[]).map(x=>html`<li>${x}</li>`)}</ul></div>`)}
          </div>
          <div class="row">
            <button class="btn" onClick=${download}><${Icon} n="file"/>Download PDF report</button>
            <button class="btn ghost" onClick=${restart}>Start new interview</button>
          </div>
        </div>`}
    </section>
  </div></main>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
